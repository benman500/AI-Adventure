<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete save — {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <main class="shell">
    <p class="breadcrumb"><a href="/">Home</a> / <a href="/saves">Saves</a> / Delete</p>
    <h1>Delete save</h1>
    <p class="lede">
      This will remove <strong>{{ character_name }}</strong> from the save list.
      The permanent save id is retained (soft-delete).
    </p>
    <p>Type <code>{{ confirmation_value }}</code> to confirm.</p>

    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="/saves/{{ save_id }}/delete" class="stack-form">
      <label>
        Confirmation
        <input type="text" name="confirmation" required autocomplete="off">
      </label>
      <div class="nav-actions">
        <button type="submit" class="button danger">Delete from list</button>
        <a class="button utility btn-utility" href="/saves">Cancel</a>
      </div>
    </form>
  </main>
</body>
</html>
