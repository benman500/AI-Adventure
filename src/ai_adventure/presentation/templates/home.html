<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <main class="shell">
    <h1>{{ app_name }}</h1>
    <p class="lede">Engine-authoritative scaffold. AI only narrates completed outcomes.</p>
    <section class="card">
      <h2>Engine outcome</h2>
      <p><strong>Kind:</strong> {{ outcome_kind }}</p>
      <p><strong>Summary:</strong> {{ outcome_summary }}</p>
      <p><strong>Authoritative:</strong> {{ authoritative }}</p>
      <p><strong>Schema marker:</strong> {{ schema_marker }}</p>
    </section>
    <section class="card">
      <h2>Narration (stub)</h2>
      <p id="narration">{{ narration }}</p>
    </section>
  </main>
  <script src="/static/js/main.js"></script>
</body>
</html>
