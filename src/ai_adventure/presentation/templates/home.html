<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <main class="shell">
    <h1>{{ app_name }}</h1>
    <p class="lede">A persistent cultivation world. Engine decides; AI only narrates later.</p>
    <nav class="nav-actions">
      <a class="button" href="/new">New Game</a>
      <a class="button secondary" href="/saves">Load Saves</a>
    </nav>
    <section class="panel">
      <h2>Scaffold status</h2>
      <p><strong>Kind:</strong> {{ outcome_kind }}</p>
      <p><strong>Summary:</strong> {{ outcome_summary }}</p>
      <p><strong>Authoritative:</strong> {{ authoritative }}</p>
      <p><strong>Schema marker:</strong> {{ schema_marker }}</p>
      <p id="narration">{{ narration }}</p>
    </section>
  </main>
  <script src="/static/js/main.js"></script>
</body>
</html>
