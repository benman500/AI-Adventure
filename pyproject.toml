[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-adventure"
version = "0.1.0"
description = "Persistent cultivation world simulation with engine-authoritative mechanics and optional AI narration."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "httpx2>=2.0",
]

[project.scripts]
ai-adventure = "ai_adventure.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_adventure = [
    "presentation/templates/*.html",
    "presentation/static/css/*.css",
    "presentation/static/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["ai_adventure"]
branch = true
